stages:
  download:
    cmd: python src/download.py --params params.yaml --output data/raw
    deps:
      - src/download.py
      - requirements.txt
    params:
      - download
    outs:
      - data/raw

  render:
    cmd: python -m playwright install chromium && python src/render.py --params params.yaml --input data/raw --output data/rendered
    deps:
      - src/render.py
      - src/contracts.py
      - requirements.txt
      - data/raw
    params:
      - render
      - download.ticker
      - download.filings
    outs:
      - data/rendered

  parse_pdfplumber:
    cmd: python src/parse_text.py --params params.yaml --input data/rendered --output data/parsed
    deps:
      - src/parse_text.py
      - src/managed
      - src/adapters.py
      - src/schema.py
      - requirements.txt
      - data/rendered
      - ${managed.cache_dir}
    params:
      - ocr
      - managed
    outs:
      - data/parsed

  tables:
    cmd: python src/tables.py --params params.yaml --input data/rendered --output data/tables
    deps:
      - src/tables.py
      - src/managed
      - src/adapters.py
      - src/schema.py
      - requirements.txt
      - data/rendered
      - data/raw
      - ${managed.cache_dir}
    params:
      - tables
      - managed
    outs:
      - data/tables

  layout:
    cmd: python src/layout.py --params params.yaml --input data/rendered --output data/layout --figures data/figures --qa reports/layout --tables data/tables
    deps:
      - src/layout.py
      - src/tables.py
      - data/tables
      - requirements.txt
      - data/rendered
    params:
      - layout
      - tables
      - ocr.dpi
    outs:
      - data/layout
      - data/figures

  parse_docling:
    cmd: python src/docling_parse.py --params params.yaml --input data/rendered --output data/docling
    deps:
      - src/docling_parse.py
      - src/tables.py
      - requirements.txt
      - data/rendered
      - data/raw
    params:
      - docling
    outs:
      - data/docling

  export:
    cmd: python src/export.py
    deps:
      - src/export.py
      - src/export_txt.py
      - src/adapters.py
      - src/schema.py
      - requirements.txt
      - data/rendered
      - ${export.layout_dir}
      - ${export.tables_dir}
      - ${export.docling_dir}
      - data/raw
    params:
      - export
    outs:
      - ${export.out_dir}

  evaluate:
    cmd: python src/evaluate.py
    deps:
      - src/evaluate.py
      - data/ground_truth
      - data/export
      - ${managed.cache_dir}
    params:
      - evaluate
      - managed
    metrics:
      - reports/metrics.json:
          cache: false
    plots:
      - reports/plots/drift.png:
          cache: false

  xbrl:
    cmd: >-
      python src/xbrl.py --input data/rendered/manifest.csv --output data/xbrl &&
      python src/xbrl.py compare --path traditional --tables data/tables &&
      python src/xbrl.py compare --path docling --tables data/docling/tables
    deps:
      - src/xbrl.py
      - requirements.txt
      - config/label_map.yaml
      - data/rendered/manifest.csv
      - data/raw
      - data/tables
      - data/docling
    params:
      - xbrl
    outs:
      - data/xbrl

  bench:
    cmd: python src/bench.py --params params.yaml --input data/rendered --output data/bench
    deps:
      - src/bench.py
      - src/parse_text.py
      - src/tables.py
      - src/layout.py
      - src/docling_parse.py
      - requirements.txt
      - tests/fixtures/scanned.pdf
      - data/rendered
    params:
      - bench
      - ocr
      - tables
      - layout
      - docling
    outs:
      - data/bench
