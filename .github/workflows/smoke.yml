name: Fixture smoke tests

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-ci.txt
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng poppler-utils
      - name: Install Python dependencies
        run: python -m pip install -r requirements-ci.txt
      - name: Extract fixture text and tables
        run: |
          python src/parse_text.py --params params.yaml --input tests/fixtures --output "$RUNNER_TEMP/lantern-smoke/parsed"
          python src/tables.py --params params.yaml --input tests/fixtures --output "$RUNNER_TEMP/lantern-smoke/tables"
      - name: Run existing tests
        run: python -m pytest -q
